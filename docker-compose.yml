services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/arm64
    volumes:
      - ./bronze:/app/bronze
      - ./silver:/app/silver
      - ./gold:/app/gold
      - ./reports:/app/reports
    environment:
      - PAGINAS=${PAGINAS:-20}
      - PER_PAGE=${PER_PAGE:-50}
      - PAUSA_BASE=${PAUSA_BASE:-1.0}
      - UMBRAL_REMAINING=${UMBRAL_REMAINING:-10}
      - MIN_DESC_LEN=${MIN_DESC_LEN:-50}
      - SEARCH_K=${SEARCH_K:-5}
    entrypoint: ["python", "-m", "pipeline.main"]
    command: ["--paginas", "${PAGINAS:-20}"]
